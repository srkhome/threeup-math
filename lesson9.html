<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分數小學堂｜小豆豆數學樂園</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F4F7FB;
            color: #2D3748;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        /* 分數樣式：分子在上、分母在下 */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 4px;
            font-weight: 900;
            line-height: 1.15;
            font-size: 0.95em;
        }
        .fraction > span:first-child {
            border-bottom: 2px solid currentColor;
            padding: 0 4px;
        }
        .fraction > span:last-child { padding: 0 4px; }

        @keyframes popIn {
            0% { transform: scale(0.94); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop { animation: popIn 0.25s ease-out both; }
        @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- 頂部：標題列 + 分頁按鈕 -->
    <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-slate-100">
        <div class="max-w-xl mx-auto px-3 pt-3 pb-2 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <!-- 回首頁按鈕 -->
                <a href="index.html" onclick="stopSpeech()"
                   class="shrink-0 bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm active:scale-95 transition whitespace-nowrap">
                    <span>🏠</span> <span>首頁</span>
                </a>
                <div class="min-w-0">
                    <h1 class="text-base font-black text-slate-700 leading-tight truncate">🍕 分數小學堂</h1>
                    <p class="text-[11px] text-slate-400 font-medium truncate">第九課 · 分數</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <div class="bg-amber-50 border border-amber-200 text-amber-700 px-3 py-1 rounded-full text-xs font-black whitespace-nowrap">
                    ⭐ <span id="scoreDisplay">0</span> / <span class="qTotal">12</span>
                </div>
                <button onclick="stopSpeech()" class="bg-rose-50 text-rose-600 px-2.5 py-1.5 rounded-full text-xs font-bold active:scale-95 transition whitespace-nowrap" title="停止朗讀">⏹ 停止</button>
            </div>
        </div>
        <div class="max-w-xl mx-auto px-3 pb-3 flex items-center gap-2">
            <button id="tabLearn" onclick="switchTab('learn')" class="flex-1 py-2 rounded-xl text-sm font-bold transition active:scale-95">📖 學習單元</button>
            <button id="tabQuiz" onclick="switchTab('quiz')" class="flex-1 py-2 rounded-xl text-sm font-bold transition active:scale-95">✏️ 學習評量</button>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-5 space-y-5">

        <!-- ================= 學習單元 ================= -->
        <section id="learnSection" class="space-y-5">
            <h2 class="font-extrabold text-slate-700 text-base px-1">📚 點按鈕，聽聽看怎麼讀！</h2>
            <div id="learnCards" class="space-y-5"></div>
            <div class="text-center">
                <button onclick="switchTab('quiz')" class="bg-indigo-600 text-white font-black px-8 py-3 rounded-2xl shadow-md active:scale-95 transition text-lg">✏️ 學完了，去做評量</button>
            </div>
        </section>

        <!-- ================= 學習評量 ================= -->
        <section id="quizSection" class="hidden space-y-5">
            <div id="resultCard" class="hidden"></div>
            <div id="quizList" class="space-y-4"></div>
        </section>

        <div class="text-center pt-2">
            <a href="index.html" onclick="stopSpeech()"
               class="inline-flex items-center gap-1 bg-white text-slate-600 px-5 py-2.5 rounded-2xl font-bold text-sm shadow-sm border border-slate-100 active:scale-95 transition">
                🏠 回到首頁
            </a>
        </div>
    </main>

    <!-- 提示視窗（取代 alert） -->
    <div id="noticeModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="pop bg-white rounded-3xl p-6 max-w-xs w-full text-center space-y-4 shadow-xl">
            <div class="text-4xl">📢</div>
            <p id="noticeText" class="text-base text-slate-600 leading-relaxed"></p>
            <button onclick="closeNotice()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-2xl shadow-md active:scale-95 transition">好的</button>
        </div>
    </div>

    <script>
        // ================= 分數工具 =================
        // 把文字裡的 m/n 轉成「分子在上、分母在下」的分數樣式
        function fracHTML(text) {
            return esc(text).replace(/(\d+)\/(\d+)/g, '<span class="fraction"><span>$1</span><span>$2</span></span>');
        }

        // 朗讀用：m/n → n分之m
        function toSpeech(text) {
            return text
                .replace(/(\d+)\/(\d+)/g, '$2分之$1')
                .replace(/</g, ' 小於 ')
                .replace(/=/g, ' 等於 ');
        }

        function fr(n, d, cls) {
            return `<span class="fraction ${cls || ''}"><span>${n}</span><span>${d}</span></span>`;
        }

        // ================= 小圖示（SVG） =================
        function svgWrap(inner) {
            return `<svg viewBox="0 0 160 100" class="w-full h-32" role="img" aria-hidden="true">${inner}</svg>`;
        }

        // SVG 內的分數（分子、橫線、分母）
        function fracSVG(x, y, n, d, size, color) {
            const w = Math.max(String(n).length, String(d).length) * size * 0.62 + 8;
            return `<text x="${x}" y="${y - 3}" font-size="${size}" font-weight="900" fill="${color}" text-anchor="middle">${n}</text>
                    <line x1="${x - w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y}" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>
                    <text x="${x}" y="${y + size}" font-size="${size}" font-weight="900" fill="${color}" text-anchor="middle">${d}</text>`;
        }

        // 平分成 4 份的披薩
        function pizzaSVG() {
            return svgWrap(`
                <circle cx="80" cy="46" r="36" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
                <line x1="80" y1="10" x2="80" y2="82" stroke="#d97706" stroke-width="2.5"/>
                <line x1="44" y1="46" x2="116" y2="46" stroke="#d97706" stroke-width="2.5"/>
                <circle cx="64" cy="30" r="3" fill="#dc2626"/><circle cx="96" cy="32" r="3" fill="#dc2626"/>
                <circle cx="62" cy="62" r="3" fill="#dc2626"/><circle cx="98" cy="60" r="3" fill="#dc2626"/>
                <text x="80" y="96" font-size="10" font-weight="900" fill="#92400e" text-anchor="middle">大小一樣 = 平分成 4 份</text>`);
        }

        // 1/4 的披薩，標示分子與分母
        function quarterSVG() {
            return svgWrap(`
                <circle cx="46" cy="50" r="36" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
                <path d="M46 50 L46 14 A36 36 0 0 1 82 50 Z" fill="#f87171" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round"/>
                <line x1="46" y1="50" x2="46" y2="86" stroke="#d97706" stroke-width="2.5"/>
                <line x1="10" y1="50" x2="46" y2="50" stroke="#d97706" stroke-width="2.5"/>
                ${fracSVG(112, 50, 1, 4, 24, '#475569')}
                <text x="140" y="42" font-size="10" font-weight="900" fill="#dc2626" text-anchor="middle">分子</text>
                <text x="140" y="72" font-size="10" font-weight="900" fill="#2563eb" text-anchor="middle">分母</text>
                <text x="112" y="94" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">四分之一</text>`);
        }

        // 1 公尺彩帶平分成 10 份，7 份塗色
        function stripSVG() {
            let s = '';
            for (let i = 0; i < 10; i++) {
                s += `<rect x="${10 + i * 14}" y="34" width="14" height="24" fill="${i < 7 ? '#5eead4' : '#ffffff'}" stroke="#0f766e" stroke-width="2"/>`;
            }
            s += `<text x="80" y="24" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">1 公尺的彩帶，平分成 10 份</text>`;
            s += `<text x="80" y="78" font-size="13" font-weight="900" fill="#0f766e" text-anchor="middle">7 個 1/10 公尺 = 7/10 公尺</text>`;
            s += `<text x="80" y="94" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">分子和分母一樣大，就是 1 個</text>`;
            return svgWrap(s);
        }

        // 5/9 和 7/9 比大小
        function compareSVG() {
            let s = '';
            for (let i = 0; i < 9; i++) {
                s += `<rect x="${16 + i * 11}" y="16" width="11" height="18" fill="${i < 5 ? '#fbbf24' : '#ffffff'}" stroke="#b45309" stroke-width="2"/>`;
                s += `<rect x="${16 + i * 11}" y="46" width="11" height="18" fill="${i < 7 ? '#f472b6' : '#ffffff'}" stroke="#be185d" stroke-width="2"/>`;
            }
            s += `<text x="132" y="30" font-size="13" font-weight="900" fill="#b45309">5/9</text>`;
            s += `<text x="132" y="60" font-size="13" font-weight="900" fill="#be185d">7/9</text>`;
            s += `<text x="80" y="90" font-size="14" font-weight="900" fill="#475569" text-anchor="middle">5/9 &lt; 7/9</text>`;
            return svgWrap(s);
        }

        // ================= 學習單元資料 =================
        const learnCards = [
            {
                emoji: '🍕', title: '1. 什麼是平分？', band: '#DDE6DA', border: '#94A68D',
                visual: pizzaSVG,
                body: `<p class="text-[22px] leading-relaxed font-bold text-slate-700">把一個圓形披薩，切成大小完全一樣的幾塊，就叫做「平分」。</p>`,
                speech: '什麼是平分？把一個圓形披薩，切成大小完全一樣的幾塊，就叫做平分。'
            },
            {
                emoji: '🔢', title: '2. 認識分子與分母', band: '#E8D6CB', border: '#c2a08f',
                visual: quarterSVG,
                body: `
                    <p class="text-[22px] leading-relaxed font-medium text-slate-700">
                        把一個披薩平分成 <b class="text-blue-600">4</b> 份，其中的 <b class="text-red-500">1</b> 份，記作
                        ${fr(`<span class="text-red-500">1</span>`, `<span class="text-blue-600">4</span>`, 'text-[26px]')}，讀作「四分之一」。
                    </p>
                    <div class="bg-slate-50 rounded-2xl p-4 text-[22px] leading-loose font-medium text-slate-700">
                        下面的數字 <b class="text-blue-600">4</b> 叫做「<b>分母</b>」（平分成幾份）。<br>
                        上面的數字 <b class="text-red-500">1</b> 叫做「<b>分子</b>」（拿了幾份）。
                    </div>`,
                speech: '認識分子與分母。如果把一個披薩平分成4份，其中的1份，我們記作四分之一。下面的數字4叫做分母，代表平分成幾份。上面的數字1叫做分子，代表拿了幾份。'
            },
            {
                emoji: '📏', title: '3. 幾個幾分之一', band: '#D6E5E3', border: '#8fb5af',
                visual: stripSVG,
                body: `
                    <p class="text-[22px] leading-relaxed font-medium text-slate-700">
                        1 公尺的彩帶平分成 10 份，每一份是 ${fr(1, 10, 'text-[24px]')} 公尺。<br>
                        7 個 ${fr(1, 10, 'text-[24px]')} 公尺合起來是 ${fr(7, 10, 'text-[24px]')} 公尺。
                    </p>
                    <div class="bg-slate-50 rounded-2xl p-4 text-[22px] leading-relaxed font-medium text-slate-700">
                        分子和分母一樣大時，就是 1 個。<br>例如：${fr(4, 4, 'text-[24px]')} 個蛋糕 = 1 個蛋糕。
                    </div>`,
                speech: '幾個幾分之一。1公尺的彩帶平分成10份，每一份是十分之一公尺。7個十分之一公尺，合起來是十分之七公尺。分子和分母一樣大時，就是1個。例如：四分之四個蛋糕，等於1個蛋糕。'
            },
            {
                emoji: '⚖️', title: '4. 比一比誰比較多', band: '#F0E6C8', border: '#cdb97a',
                visual: compareSVG,
                body: `
                    <p class="text-[22px] leading-relaxed font-medium text-slate-700">
                        分母一樣的時候，<b>分子越大，分數就越大</b>。<br>
                        例如：${fr(5, 9, 'text-[24px]')} &lt; ${fr(7, 9, 'text-[24px]')}。
                    </p>
                    <div class="bg-slate-50 rounded-2xl p-4 text-[22px] leading-relaxed font-medium text-slate-700">
                        ${fr(5, 6, 'text-[24px]')} 條吐司還差一點點，才有 1 條，所以 1 條比較多。
                    </div>`,
                speech: '比一比誰比較多。分母一樣的時候，分子越大，分數就越大。例如：九分之五，小於九分之七。六分之五條吐司還差一點點，才有1條，所以1條比較多。'
            }
        ];

        // ================= 評量題庫（全部已驗算） =================
        // a 為正確選項在 opts 中的索引
        const quizBank = [
            { q: '一個披薩平分成 12 份，其中 1 份是幾個披薩？',
              opts: ['1個', '12個', '1/12個', '12/1個'], a: 2,
              exp: '平分成 12 份，其中 1 份就是 1/12 個披薩。' },
            { q: '「三分之一」記作什麼？',
              opts: ['3/1', '1/3', '3', '1'], a: 1,
              exp: '三分之一：分母是 3（平分成 3 份），分子是 1（拿 1 份），記作 1/3。' },
            { q: '「十分之五」的記法是什麼？',
              opts: ['5/10', '10/5', '50', '1/5'], a: 0,
              exp: '十分之五：分母是 10，分子是 5，記作 5/10。' },
            { q: '分數 7/8 讀作什麼？',
              opts: ['七分之八', '八分之七', '八七', '七八'], a: 1,
              exp: '7/8 的分母是 8、分子是 7，先讀分母，所以讀作八分之七。' },
            { q: '一盒印章有 12 個，平分給 12 個小朋友，1 個小朋友分到幾盒印章？',
              opts: ['1盒', '12盒', '1/12盒', '1/2盒'], a: 2,
              exp: '1 盒平分給 12 個人，每個人分到 1/12 盒（也就是 1 個印章）。' },
            { q: '把一條長 1 公尺的彩帶平分成 10 等分，2/10 公尺是幾個 1/10 公尺？',
              opts: ['1個', '2個', '10個', '20個'], a: 1,
              exp: '2/10 公尺就是 2 個 1/10 公尺。' },
            { q: '7 個 1/10 公尺合起來是幾公尺？',
              opts: ['7公尺', '1/7公尺', '10/7公尺', '7/10公尺'], a: 3,
              exp: '7 個 1/10 公尺合起來是 7/10 公尺。' },
            { q: '一盤餅乾有 12 片，哥哥吃了 3 片，是吃了幾分之幾盤餅乾？',
              opts: ['3/12盤', '1/12盤', '12/3盤', '3盤'], a: 0,
              exp: '1 盤平分成 12 片，吃了 3 片，就是 3/12 盤。' },
            { q: '承上題（一盤餅乾 12 片），弟弟吃了 7/12 盤，是吃了幾片餅乾？',
              opts: ['12片', '7片', '5片', '1/12片'], a: 1,
              exp: '1/12 盤是 1 片，7/12 盤就是 7 個 1/12 盤，也就是 7 片。' },
            { q: '一個蛋糕平分切成 4 塊。4 個 1/4 塊蛋糕合起來，是幾個蛋糕？',
              opts: ['4個', '1個', '1/4個', '8個'], a: 1,
              exp: '4 個 1/4 合起來是 4/4，分子和分母一樣大，就是 1 個蛋糕。' },
            { q: '一條吐司平分成 6 片，5/6 條吐司和 1 條吐司，哪一個比較多？',
              opts: ['5/6 條', '1 條', '一樣多', '無法比較'], a: 1,
              exp: '5/6 條還差 1/6 條才有 1 條，所以 1 條比較多。' },
            { q: '5/9 和 7/9 哪一個比較大？',
              opts: ['5/9', '7/9', '一樣大', '無法比較'], a: 1,
              exp: '分母一樣，分子越大，分數越大。7 比 5 大，所以 7/9 比較大。' }
        ];

        const LABELS = ['①', '②', '③', '④'];
        const STATE = {
            def:   'border-slate-200 bg-white text-slate-800',
            right: 'border-emerald-500 bg-emerald-50 text-emerald-800',
            wrong: 'border-rose-500 bg-rose-50 text-rose-800',
            dim:   'border-slate-100 bg-slate-50 text-slate-400'
        };
        const QCOLORS = ['#C49799', '#D4BB92', '#a69bb3', '#94A68D', '#8DA3A6', '#7fb0a6'];

        let quiz = [];      // 打亂選項後 [{q, exp, opts:[{text, correct}]}]
        let answers = {};   // { 題號: 選擇的選項索引 }

        // ================= 工具 =================
        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function showNotice(msg) {
            document.getElementById('noticeText').innerText = msg;
            const m = document.getElementById('noticeModal');
            m.classList.remove('hidden');
            m.classList.add('flex');
        }
        function closeNotice() {
            const m = document.getElementById('noticeModal');
            m.classList.add('hidden');
            m.classList.remove('flex');
        }

        // ================= 語音 =================
        let activeBtn = null;
        let activeUtt = null;

        function resetActiveBtn() {
            if (activeBtn) {
                activeBtn.innerText = activeBtn.dataset.label;
                activeBtn.classList.remove('opacity-75');
                activeBtn = null;
            }
        }

        function speak(text, btn) {
            if (!('speechSynthesis' in window)) {
                showNotice('您的裝置或瀏覽器不支援語音朗讀功能，建議使用 Chrome 或 Safari。');
                return;
            }
            window.speechSynthesis.cancel();
            resetActiveBtn();

            const u = new SpeechSynthesisUtterance(toSpeech(text));
            u.lang = 'zh-TW';
            u.rate = 0.85;   // 放慢語速，適合小朋友
            u.pitch = 1.1;
            activeUtt = u;

            if (btn && btn.dataset.label) {
                btn.innerText = '🗣️ 播放中...';
                btn.classList.add('opacity-75');
                activeBtn = btn;
            }
            const done = () => { if (activeUtt === u) { resetActiveBtn(); activeUtt = null; } };
            u.onend = done;
            u.onerror = done;
            window.speechSynthesis.speak(u);
        }

        function stopSpeech() {
            activeUtt = null;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            resetActiveBtn();
        }

        window.addEventListener('pagehide', stopSpeech);

        // ================= 分頁 =================
        const TAB_ON = 'flex-1 py-2 rounded-xl text-sm font-bold transition active:scale-95 bg-indigo-600 text-white shadow-md';
        const TAB_OFF = 'flex-1 py-2 rounded-xl text-sm font-bold transition active:scale-95 bg-slate-100 text-slate-600';

        function switchTab(tab) {
            stopSpeech();
            const isLearn = tab === 'learn';
            document.getElementById('learnSection').classList.toggle('hidden', !isLearn);
            document.getElementById('quizSection').classList.toggle('hidden', isLearn);
            document.getElementById('tabLearn').className = isLearn ? TAB_ON : TAB_OFF;
            document.getElementById('tabQuiz').className = isLearn ? TAB_OFF : TAB_ON;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ================= 學習單元 =================
        function renderLearn() {
            document.getElementById('learnCards').innerHTML = learnCards.map((c, i) => `
                <div class="pop bg-white rounded-3xl shadow-md border-2 overflow-hidden" style="border-color:${c.border}">
                    <div class="p-3" style="background:${c.band}">${c.visual()}</div>
                    <div class="p-5 space-y-4">
                        <h3 class="text-[28px] font-black text-slate-800 flex items-center gap-2"><span>${c.emoji}</span>${c.title}</h3>
                        ${c.body}
                        <button type="button" data-learn="${i}" data-label="🔊 播放說明"
                                class="learn-play w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl py-4 text-[22px] font-black shadow-md active:scale-[.98] transition">🔊 播放說明</button>
                    </div>
                </div>`).join('');
        }

        document.getElementById('learnCards').addEventListener('click', e => {
            const b = e.target.closest('.learn-play');
            if (b) speak(learnCards[Number(b.dataset.learn)].speech, b);
        });

        // ================= 學習評量 =================
        function newQuiz() {
            quiz = quizBank.map(item => ({
                q: item.q,
                exp: item.exp,
                opts: shuffle(item.opts.map((t, i) => ({ text: t, correct: i === item.a })))
            }));
            answers = {};
        }

        function getScore() {
            return quiz.filter((item, i) => answers[i] !== undefined && item.opts[answers[i]].correct).length;
        }

        function renderQuiz() {
            document.getElementById('quizList').innerHTML = quiz.map((item, i) => {
                const done = answers[i] !== undefined;
                const color = QCOLORS[i % QCOLORS.length];
                const opts = item.opts.map((o, k) => {
                    let st = 'def';
                    if (done) {
                        if (o.correct) st = 'right';
                        else if (k === answers[i]) st = 'wrong';
                        else st = 'dim';
                    }
                    return `<button type="button" data-q="${i}" data-k="${k}" ${done ? 'disabled' : ''}
                        class="opt-btn text-left px-4 py-3 rounded-2xl border-2 text-[22px] font-bold shadow-sm transition active:scale-[.98] flex items-center gap-2 ${STATE[st]}">
                        <span class="shrink-0 font-black text-indigo-500">${LABELS[k]}</span><span>${fracHTML(o.text)}</span></button>`;
                }).join('');

                let fb = '';
                if (done) {
                    const ok = item.opts[answers[i]].correct;
                    const right = item.opts.find(o => o.correct).text;
                    fb = ok
                        ? `<div class="bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-2xl p-4 text-[20px] leading-relaxed"><b>✅ 答對了！好棒！</b><br>💡 ${fracHTML(item.exp)}</div>`
                        : `<div class="bg-rose-50 text-rose-800 border border-rose-200 rounded-2xl p-4 text-[20px] leading-relaxed"><b>❌ 答錯了喔！</b>　正確答案：<b>${fracHTML(right)}</b><br>💡 ${fracHTML(item.exp)}</div>`;
                }

                return `
                    <div class="bg-white rounded-3xl border-2 shadow-sm p-4 space-y-3" style="border-color:${color}">
                        <div class="flex items-center justify-between gap-2">
                            <span class="w-9 h-9 rounded-xl text-white flex items-center justify-center font-black" style="background:${color}">${i + 1}</span>
                            <button type="button" data-read="${i}" class="read-btn bg-indigo-50 text-indigo-600 px-4 py-2 rounded-full text-base font-black active:scale-95 transition">🔊 讀題目</button>
                        </div>
                        <p class="text-[22px] font-bold text-slate-800 leading-relaxed">${fracHTML(item.q)}</p>
                        <div class="grid grid-cols-1 min-[420px]:grid-cols-2 gap-3">${opts}</div>
                        ${fb}
                    </div>`;
            }).join('');

            document.getElementById('scoreDisplay').innerText = getScore();
            renderResult();
        }

        function renderResult() {
            const card = document.getElementById('resultCard');
            const total = quiz.length;
            if (Object.keys(answers).length < total) {
                card.className = 'hidden';
                card.innerHTML = '';
                return;
            }
            const score = getScore();
            let emoji, msg;
            if (score === total) { emoji = '🏆'; msg = '全部答對！你是分數小達人！'; }
            else if (score >= 10) { emoji = '🌟'; msg = '很棒喔！再細心一點就更完美了！'; }
            else if (score >= 7) { emoji = '👍'; msg = '不錯喔！看看答錯題目的說明，再試一次吧！'; }
            else { emoji = '💪'; msg = '沒關係！回到學習單元再看一次，再來挑戰！'; }

            card.className = 'pop';
            card.innerHTML = `
                <div class="bg-white rounded-3xl border-2 border-amber-200 shadow-md p-5 space-y-4 text-center">
                    <div class="text-6xl">${emoji}</div>
                    <div class="text-[40px] font-black text-amber-600">${score}<span class="text-xl text-slate-400"> / ${total} 題</span></div>
                    <p class="text-[20px] font-bold text-slate-600 leading-relaxed">${msg}</p>
                    <div class="flex gap-2">
                        <button onclick="restartQuiz()" class="flex-1 bg-indigo-600 text-white font-black rounded-2xl py-3 text-lg shadow-md active:scale-95 transition">🔄 重新挑戰</button>
                        <button onclick="switchTab('learn')" class="flex-1 bg-slate-100 text-slate-700 font-black rounded-2xl py-3 text-lg shadow-sm active:scale-95 transition">📖 看學習單元</button>
                    </div>
                    <a href="index.html" onclick="stopSpeech()" class="block bg-white border-2 border-slate-200 text-slate-700 font-black rounded-2xl py-3 text-lg active:scale-95 transition">🏠 回首頁</a>
                </div>`;
            speak(`評量結束！你答對了 ${score} 題，總共 ${total} 題。`);
        }

        document.getElementById('quizList').addEventListener('click', e => {
            const read = e.target.closest('.read-btn');
            if (read) {
                const i = Number(read.dataset.read);
                const item = quiz[i];
                const opts = item.opts.map((o, k) => `選項${k + 1}，${o.text}`).join('。');
                speak(`第 ${i + 1} 題。${item.q}。${opts}`);
                return;
            }
            const opt = e.target.closest('.opt-btn');
            if (opt) {
                const i = Number(opt.dataset.q);
                if (answers[i] !== undefined) return;
                const k = Number(opt.dataset.k);
                answers[i] = k;
                const item = quiz[i];
                const ok = item.opts[k].correct;
                const y = window.scrollY;
                renderQuiz();
                window.scrollTo(0, y);
                // 全部答完時成績卡會自己朗讀，其餘題目朗讀對錯與說明
                if (Object.keys(answers).length < quiz.length) {
                    speak((ok ? '答對了！好棒！' : '答錯了，') + item.exp);
                }
            }
        });

        function restartQuiz() {
            stopSpeech();
            newQuiz();
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ================= 初始化 =================
        document.querySelectorAll('.qTotal').forEach(el => { el.innerText = quizBank.length; });
        renderLearn();
        newQuiz();
        renderQuiz();
        switchTab('learn');
    </script>
</body>
</html>
