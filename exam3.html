<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測驗三｜第五至第九課｜小豆豆數學樂園</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F4F7FB;
            color: #2D3748;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-pop { animation: popIn 0.2s ease-out; }
        .pop { animation: popIn 0.4s ease-out both; }
        @media (prefers-reduced-motion: reduce) { .modal-pop, .pop { animation: none; } }
        /* 分數：分子在上、分母在下 */
        .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle;
                    margin: 0 3px; font-weight: 900; line-height: 1.15; font-size: 0.95em; }
        .fraction > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px; }
        .fraction > span:last-child { padding: 0 4px; }
        /* 隱藏數字輸入框的上下箭頭 */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="min-h-screen pb-28">

    <!-- 頂部標題列 -->
    <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-slate-100">
        <div class="max-w-2xl mx-auto px-3 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <a href="index.html" onclick="stopSpeech()"
                   class="shrink-0 bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm active:scale-95 transition whitespace-nowrap">
                    <span>🏠</span> <span>首頁</span>
                </a>
                <div class="min-w-0">
                    <h1 class="text-base font-black text-slate-700 leading-tight truncate">測驗三</h1>
                    <p class="text-[11px] text-slate-400 font-medium truncate">第五課至第九課</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <div id="headerCount" class="bg-amber-50 border border-amber-200 text-amber-700 px-3 py-1 rounded-full text-xs font-black whitespace-nowrap">
                    ✏️ <span id="headerAnswered">0</span>/<span class="totalQ">28</span>
                </div>
                <button onclick="stopSpeech()" class="bg-rose-50 text-rose-600 px-2.5 py-1.5 rounded-full text-xs font-bold active:scale-95 transition whitespace-nowrap" title="停止朗讀">⏹ 停止</button>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-4 space-y-5">

        <!-- 考試說明 -->
        <section id="introCard" class="rounded-3xl p-5 bg-gradient-to-br from-amber-100 via-orange-100 to-rose-100 border-2 border-white shadow-sm space-y-2">
            <div class="flex items-center gap-3">
                <div class="text-5xl">📝</div>
                <div>
                    <h2 class="text-xl font-black text-slate-800">測驗三｜第五至第九課</h2>
                    <p class="text-sm text-slate-600 font-medium">共 <span class="totalQ">28</span> 題，滿分 100 分</p>
                </div>
            </div>
            <ul class="text-xs text-slate-600 font-medium space-y-1 pt-1">
                <li>⭕ 是非題 10 題（每題 2 分）　🔘 單選題 10 題（每題 4 分）　🧮 計算題 8 題（每題 5 分）</li>
                <li>🔊 按題目旁的喇叭可以聽老師唸題目。</li>
                <li>✅ 全部寫完按下方「交卷」，就會看到分數、答案與解析。</li>
            </ul>
        </section>

        <!-- 成績卡（交卷後顯示） -->
        <section id="resultCard" class="hidden"></section>

        <!-- 題目區 -->
        <div id="examBody" class="space-y-6"></div>

        <div class="text-center pt-2">
            <a href="index.html" onclick="stopSpeech()"
               class="inline-flex items-center gap-1 bg-white text-slate-600 px-5 py-2.5 rounded-2xl font-bold text-sm shadow-sm border border-slate-100 active:scale-95 transition">
                🏠 回到首頁
            </a>
        </div>
    </main>

    <!-- 底部操作列 -->
    <div class="fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 shadow-lg">
        <div class="max-w-2xl mx-auto px-4 py-3">
            <div id="barExam" class="flex items-center gap-3">
                <div class="text-sm font-bold text-slate-600">已作答 <span id="answeredCount">0</span> / <span class="totalQ">28</span></div>
                <button onclick="submitExam()" class="ml-auto bg-indigo-600 hover:bg-indigo-700 text-white font-black px-8 py-2.5 rounded-2xl shadow-md active:scale-95 transition">📝 交卷</button>
            </div>
            <div id="barDone" class="hidden flex items-center gap-2">
                <button onclick="restartExam()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-2.5 rounded-2xl shadow-md active:scale-95 transition">🔄 重新測驗</button>
                <a href="index.html" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black py-2.5 rounded-2xl shadow-sm active:scale-95 transition text-center">🏠 回首頁</a>
            </div>
        </div>
    </div>

    <!-- 交卷確認視窗 -->
    <div id="confirmModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="modal-pop bg-white rounded-3xl p-6 max-w-xs w-full text-center space-y-4 shadow-xl">
            <div class="text-4xl">🤔</div>
            <p id="confirmText" class="text-sm text-slate-600 leading-relaxed font-medium"></p>
            <div class="flex gap-2">
                <button onclick="continueAnswering()" class="flex-1 bg-slate-100 text-slate-700 font-bold py-3 rounded-2xl active:scale-95 transition">繼續作答</button>
                <button onclick="confirmSubmit()" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-2xl shadow-md active:scale-95 transition">直接交卷</button>
            </div>
        </div>
    </div>

    <!-- 一般提示視窗 -->
    <div id="noticeModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="modal-pop bg-white rounded-3xl p-6 max-w-xs w-full text-center space-y-4 shadow-xl">
            <div class="text-4xl">📢</div>
            <p id="noticeText" class="text-sm text-slate-600 leading-relaxed"></p>
            <button onclick="closeModal('noticeModal')" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-2xl shadow-md active:scale-95 transition">好的</button>
        </div>
    </div>

    <script>
        // ================= 題庫（內容皆已逐題驗算） =================
        const bank = {
            tf: [
                { id: 'tf1', lesson: 5, q: '邊畫得比較長，角就會變大。', a: false,
                  exp: '角的大小看開口大小，邊畫得長短不會影響角的大小。' },
                { id: 'tf2', lesson: 5, q: '長方形的上、下兩條邊一樣長，左、右兩條邊也一樣長。', a: true,
                  exp: '長方形的對邊一樣長，4 個角都是直角。' },
                { id: 'tf3', lesson: 6, q: '一個圖形剛好排滿 12 個 1 平方公分的小方塊，面積是 12 平方公分。', a: true,
                  exp: '每個小方塊是 1 平方公分，12 個就是 12 平方公分。' },
                { id: 'tf4', lesson: 6, q: '把一張 30 平方公分的色紙剪開，再拼成別的形狀，面積會變小。', a: false,
                  exp: '剪開再拼起來只是換位置，面積不會改變，還是 30 平方公分。' },
                { id: 'tf5', lesson: 7, q: '25 ÷ 4 = 6 … 1。', a: true,
                  exp: '4 × 6 = 24，25 − 24 = 1，所以商是 6，餘 1。' },
                { id: 'tf6', lesson: 7, q: '除數是 7 的時候，餘數可能是 7。', a: false,
                  exp: '餘數一定要比除數小。除數是 7，餘數只可能是 0 到 6。' },
                { id: 'tf7', lesson: 8, q: '2 公升等於 2000 毫升。', a: true,
                  exp: '1 公升 = 1000 毫升，所以 2 公升 = 2000 毫升。' },
                { id: 'tf8', lesson: 8, q: '1 公升 80 毫升等於 1800 毫升。', a: false,
                  exp: '1 公升是 1000 毫升，再加 80 毫升是 1080 毫升，不是 1800 毫升。' },
                { id: 'tf9', lesson: 9, q: '5 個 1/8 合起來是 5/8。', a: true,
                  exp: '5 個 1/8 合起來就是 5/8。' },
                { id: 'tf10', lesson: 9, q: '3/7 比 5/7 大。', a: false,
                  exp: '分母一樣，分子越大，分數越大。5 比 3 大，所以 5/7 比較大。' }
            ],
            mcq: [
                { id: 'm1', lesson: 5, q: '下面哪一個說法是正確的？',
                  opts: ['正方形的 4 條邊一樣長', '長方形的 4 條邊都一樣長', '正方形的 4 個角都是銳角', '長方形只有 3 個直角'], a: '正方形的 4 條邊一樣長',
                  exp: '正方形 4 條邊一樣長、4 個角都是直角；長方形是對邊一樣長。' },
                { id: 'm2', lesson: 5, q: '比直角大的角，叫做什麼角？',
                  opts: ['鈍角', '銳角', '直角', '小角'], a: '鈍角',
                  exp: '比直角小的角是銳角，比直角大的角是鈍角。' },
                { id: 'm3', lesson: 6, q: '一個圖形剛好可以排滿 15 個「1 平方公分」的小方塊，它的面積是多少？',
                  opts: ['15 平方公分', '1 平方公分', '5 平方公分', '30 平方公分'], a: '15 平方公分',
                  exp: '每個小方塊是 1 平方公分，15 個就是 15 平方公分。' },
                { id: 'm4', lesson: 6, q: '一張卡片放在方格板上，一排有 5 格，共有 6 排，這張卡片的面積是多少平方公分？',
                  opts: ['11 平方公分', '30 平方公分', '56 平方公分', '25 平方公分'], a: '30 平方公分',
                  exp: '一排 5 格，6 排就是 5 × 6 = 30 格，面積 30 平方公分。' },
                { id: 'm5', lesson: 7, q: '45 ÷ 6 = ？',
                  opts: ['7 … 3', '8 … 1', '6 … 9', '7 … 4'], a: '7 … 3',
                  exp: '6 × 7 = 42，45 − 42 = 3，所以商是 7，餘 3。' },
                { id: 'm6', lesson: 7, q: '有 52 個蘋果，每 8 個裝成一盒，最多可以裝滿幾盒？',
                  opts: ['6 盒', '7 盒', '5 盒', '4 盒'], a: '6 盒',
                  exp: '52 ÷ 8 = 6 … 4，最多裝滿 6 盒，還剩 4 個。' },
                { id: 'm7', lesson: 8, q: '3 公升 400 毫升等於多少毫升？',
                  opts: ['3400 毫升', '340 毫升', '3040 毫升', '304 毫升'], a: '3400 毫升',
                  exp: '3 公升 = 3000 毫升，再加 400 毫升，等於 3400 毫升。' },
                { id: 'm8', lesson: 8, q: '2500 毫升等於幾公升幾毫升？',
                  opts: ['2 公升 500 毫升', '25 公升', '2 公升 50 毫升', '250 公升'], a: '2 公升 500 毫升',
                  exp: '2500 裡面有 2 個 1000，還多 500，所以是 2 公升 500 毫升。' },
                { id: 'm9', lesson: 9, q: '「八分之三」記作什麼？',
                  opts: ['3/8', '8/3', '38', '1/8'], a: '3/8',
                  exp: '八分之三：分母是 8（平分成 8 份），分子是 3（拿 3 份），記作 3/8。' },
                { id: 'm10', lesson: 9, q: '4/11 和 9/11 哪一個比較大？',
                  opts: ['9/11', '4/11', '一樣大', '無法比較'], a: '9/11',
                  exp: '分母一樣，分子越大，分數越大。9 比 4 大，所以 9/11 比較大。' }
            ],
            calc: [
                { id: 'c1', lesson: 5, q: '一個長方形有幾個直角？', a: [4], units: ['個'],
                  exp: '長方形的 4 個角都是直角。' },
                { id: 'c2', lesson: 6, q: '一張卡片放在方格板上，一排有 8 格，共有 7 排，面積是多少平方公分？', a: [56], units: ['平方公分'],
                  exp: '8 × 7 = 56，面積是 56 平方公分。' },
                { id: 'c3', lesson: 7, q: '75 ÷ 9 = ？ 請填商和餘數。', a: [8, 3], units: ['（商）', '（餘數）'], labels: ['商', '餘數'], answerText: '商 8，餘 3',
                  exp: '9 × 8 = 72，75 − 72 = 3，所以商是 8，餘 3。' },
                { id: 'c4', lesson: 7, q: '38 個小朋友去郊遊，一輛車坐 6 個人，最少需要幾輛車？', a: [7], units: ['輛'],
                  exp: '38 ÷ 6 = 6 … 2，剩下的 2 個小朋友也要坐車，所以 6 + 1 = 7 輛。' },
                { id: 'c5', lesson: 8, q: '4 公升 250 毫升等於多少毫升？', a: [4250], units: ['毫升'],
                  exp: '4 公升 = 4000 毫升，再加 250 毫升，等於 4250 毫升。' },
                { id: 'c6', lesson: 8, q: '水壺裡有 2 公升 600 毫升的水，喝掉 1350 毫升後，還剩下多少毫升？', a: [1250], units: ['毫升'],
                  exp: '2 公升 600 毫升 = 2600 毫升，2600 − 1350 = 1250 毫升。' },
                { id: 'c7', lesson: 9, q: '一盒有 16 顆糖果，小美吃了 5/16 盒，吃了幾顆糖果？', a: [5], units: ['顆'],
                  exp: '1/16 盒是 1 顆，5/16 盒就是 5 個 1/16 盒，也就是 5 顆。' },
                { id: 'c8', lesson: 9, q: '把 1 個蛋糕平分成 8 塊，吃掉 3 塊，吃掉的是幾分之幾個蛋糕？請填分子和分母。', a: [3, 8], units: ['（分子）', '（分母）'], labels: ['分子', '分母'], answerText: '3/8',
                  exp: '平分成 8 塊，分母是 8；吃了 3 塊，分子是 3，所以是 3/8 個蛋糕。' }
            ]
        };

        const SECTIONS = [
            { key: 'tf',   title: '一、是非題', sub: '對的選「⭕ 對」，錯的選「❌ 錯」（每題 2 分）', head: 'bg-sky-100 text-sky-900' },
            { key: 'mcq',  title: '二、單選題', sub: '選出一個最正確的答案（每題 4 分）',           head: 'bg-violet-100 text-violet-900' },
            { key: 'calc', title: '三、計算題', sub: '把答案寫在空格裡（每題 5 分）',               head: 'bg-amber-100 text-amber-900' }
        ];
        const POINTS = { tf: 2, mcq: 4, calc: 5 };
        const LESSON_NAMES = { 1: '10000以內的數', 2: '三、四位數加減法', 3: '毫米與公分', 4: '乘法', 5: '角與圖形', 6: '面積', 7: '除法', 8: '公升與毫升', 9: '分數' };
        const LESSON_TAG = {
            1: 'bg-sky-100 text-sky-700', 2: 'bg-emerald-100 text-emerald-700',
            3: 'bg-amber-100 text-amber-700', 4: 'bg-purple-100 text-purple-700',
            5: 'bg-rose-100 text-rose-700', 6: 'bg-teal-100 text-teal-700',
            7: 'bg-indigo-100 text-indigo-700', 8: 'bg-cyan-100 text-cyan-700',
            9: 'bg-lime-100 text-lime-700'
        };
        const LABELS = ['①', '②', '③', '④'];
        const TOTAL = bank.tf.length + bank.mcq.length + bank.calc.length;

        const STATE = {
            def:      'border-slate-200 bg-white text-slate-700',
            selected: 'border-indigo-500 bg-indigo-50 text-indigo-700',
            right:    'border-emerald-500 bg-emerald-50 text-emerald-700',
            wrong:    'border-rose-500 bg-rose-50 text-rose-700',
            dim:      'border-slate-100 bg-slate-50 text-slate-400'
        };
        const BASE = {
            tf:  'py-3 rounded-2xl border-2 font-black text-base transition active:scale-95 ',
            mcq: 'w-full text-left px-4 py-3 rounded-2xl border-2 font-bold text-sm transition active:scale-[.98] flex items-center gap-2 '
        };

        // ================= 狀態 =================
        let order = {};      // 各大題目前的出題順序
        let mcqOpts = {};    // 單選題打亂後的選項
        let ans = {};        // 作答內容
        let graded = false;
        let onlyWrong = false;
        let results = {};    // 每題對錯

        // ================= 工具 =================
        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // 文字轉 HTML，並把 m/n 轉成分數樣式
        function ft(s) {
            return esc(s).replace(/(\d+)\/(\d+)/g, '<span class="fraction"><span>$1</span><span>$2</span></span>');
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function findQ(id) {
            for (const key of Object.keys(bank)) {
                const q = bank[key].find(x => x.id === id);
                if (q) return { type: key, q };
            }
            return null;
        }

        function formatCalcAnswer(q) {
            if (q.answerText) return q.answerText;
            return q.a.map((v, i) => v + (q.units[i] ? ' ' + q.units[i] : '')).join(' ');
        }

        function showModal(id) {
            const m = document.getElementById(id);
            m.classList.remove('hidden');
            m.classList.add('flex');
        }
        function closeModal(id) {
            const m = document.getElementById(id);
            m.classList.add('hidden');
            m.classList.remove('flex');
        }
        function showNotice(msg) {
            document.getElementById('noticeText').innerText = msg;
            showModal('noticeModal');
        }

        // ================= 語音 =================
        function toSpeech(text) {
            return text
                .replace(/(\d+)\/(\d+)/g, '$2分之$1')
                .replace(/÷/g, ' 除以 ')
                .replace(/…/g, ' 餘 ')
                .replace(/\s[−-]\s/g, ' 減 ')
                .replace(/\+/g, ' 加 ')
                .replace(/×/g, ' 乘以 ')
                .replace(/=/g, ' 等於 ')
                .replace(/>/g, ' 大於 ')
                .replace(/</g, ' 小於 ')
                .replace(/[？?]/g, ' 多少');
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) {
                showNotice('您的瀏覽器不支援語音朗讀功能');
                return;
            }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-TW';
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        function stopSpeech() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function readQ(id) {
            const f = findQ(id);
            if (!f) return;
            let t = toSpeech(f.q.q);
            if (f.type === 'tf') {
                t += ' 這句話是對的，還是錯的？';
            } else if (f.type === 'mcq') {
                mcqOpts[id].forEach((o, i) => { t += ` 選項${i + 1}，${toSpeech(o)}。`; });
            }
            speak(t);
        }

        window.addEventListener('pagehide', stopSpeech);

        // ================= 畫面產生 =================
        function cardHTML(type, q, n) {
            let area = '';
            if (type === 'tf') {
                area = `
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" data-type="tf" data-id="${q.id}" data-val="true"  class="choice ${BASE.tf}${STATE.def}">⭕ 對</button>
                        <button type="button" data-type="tf" data-id="${q.id}" data-val="false" class="choice ${BASE.tf}${STATE.def}">❌ 錯</button>
                    </div>`;
            } else if (type === 'mcq') {
                area = `<div class="space-y-2">` + mcqOpts[q.id].map((o, i) => `
                    <button type="button" data-type="mcq" data-id="${q.id}" data-idx="${i}" class="choice ${BASE.mcq}${STATE.def}">
                        <span class="shrink-0 font-black text-indigo-500">${LABELS[i]}</span><span>${ft(o)}</span>
                    </button>`).join('') + `</div>`;
            } else {
                area = `<div class="flex flex-wrap items-center gap-2">` + q.a.map((_, i) => `
                    <input type="number" inputmode="numeric" data-id="${q.id}" data-i="${i}" placeholder="${q.labels ? q.labels[i] : '答案'}"
                           class="calc-input w-28 border-2 border-slate-200 rounded-xl px-3 py-2 text-lg font-black text-center text-slate-700 focus:outline-none focus:border-indigo-500">
                    ${q.units[i] ? `<span class="text-sm font-bold text-slate-500">${esc(q.units[i])}</span>` : ''}`).join('') + `</div>`;
            }

            return `
                <div id="card-${q.id}" class="qcard bg-white rounded-3xl border-2 border-slate-100 shadow-sm p-4 space-y-3">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-slate-800 text-white flex items-center justify-center font-black text-sm">${n}</span>
                            <span class="text-[11px] font-black px-2 py-0.5 rounded-full ${LESSON_TAG[q.lesson]}">第 ${q.lesson} 課</span>
                        </div>
                        <button type="button" onclick="readQ('${q.id}')" class="shrink-0 bg-indigo-50 text-indigo-600 w-9 h-9 rounded-full flex items-center justify-center active:scale-90 transition" aria-label="朗讀題目">🔊</button>
                    </div>
                    <p class="font-bold text-slate-800 leading-relaxed">${ft(q.q)}</p>
                    ${area}
                    <div id="fb-${q.id}" class="hidden"></div>
                </div>`;
        }

        function render() {
            let html = '';
            SECTIONS.forEach(sec => {
                html += `<section class="space-y-3">
                    <div class="${sec.head} rounded-2xl px-4 py-3">
                        <h2 class="font-black text-base">${sec.title}</h2>
                        <p class="text-xs font-medium opacity-80">${sec.sub}</p>
                    </div>`;
                order[sec.key].forEach((q, i) => { html += cardHTML(sec.key, q, i + 1); });
                html += `</section>`;
            });
            document.getElementById('examBody').innerHTML = html;
        }

        // ================= 作答互動 =================
        function setChoice(btn, state) {
            btn.className = 'choice ' + BASE[btn.dataset.type] + STATE[state];
        }

        function isAnswered(type, q) {
            const v = ans[q.id];
            if (type === 'calc') {
                return Array.isArray(v) && q.a.every((_, i) => v[i] !== undefined && String(v[i]).trim() !== '');
            }
            return v !== undefined;
        }

        function countAnswered() {
            let n = 0;
            Object.keys(bank).forEach(k => bank[k].forEach(q => { if (isAnswered(k, q)) n++; }));
            return n;
        }

        function updateCount() {
            const n = countAnswered();
            document.getElementById('answeredCount').innerText = n;
            document.getElementById('headerAnswered').innerText = n;
        }

        document.getElementById('examBody').addEventListener('click', e => {
            if (graded) return;
            const btn = e.target.closest('.choice');
            if (!btn) return;
            const id = btn.dataset.id;

            if (btn.dataset.type === 'tf') {
                ans[id] = btn.dataset.val === 'true';
            } else {
                ans[id] = mcqOpts[id][Number(btn.dataset.idx)];
            }
            document.querySelectorAll(`#card-${id} .choice`).forEach(b => setChoice(b, b === btn ? 'selected' : 'def'));
            updateCount();
        });

        document.getElementById('examBody').addEventListener('input', e => {
            if (graded) return;
            const input = e.target.closest('.calc-input');
            if (!input) return;
            const id = input.dataset.id;
            if (!Array.isArray(ans[id])) ans[id] = [];
            ans[id][Number(input.dataset.i)] = input.value;
            updateCount();
        });

        // ================= 交卷與評分 =================
        function firstUnanswered() {
            for (const sec of SECTIONS) {
                for (const q of order[sec.key]) {
                    if (!isAnswered(sec.key, q)) return q;
                }
            }
            return null;
        }

        function submitExam() {
            if (graded) return;
            stopSpeech();
            const left = TOTAL - countAnswered();
            if (left > 0) {
                document.getElementById('confirmText').innerText = `還有 ${left} 題沒有作答喔！要繼續作答，還是直接交卷呢？`;
                showModal('confirmModal');
            } else {
                gradeExam();
            }
        }

        function continueAnswering() {
            closeModal('confirmModal');
            const q = firstUnanswered();
            if (q) {
                const card = document.getElementById('card-' + q.id);
                if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function confirmSubmit() {
            closeModal('confirmModal');
            gradeExam();
        }

        function checkOne(type, q) {
            if (!isAnswered(type, q)) return false;
            if (type === 'tf') return ans[q.id] === q.a;
            if (type === 'mcq') return ans[q.id] === q.a;
            return q.a.every((v, i) => Number(ans[q.id][i]) === v);
        }

        function gradeExam() {
            graded = true;
            results = {};
            const sectionScore = { tf: 0, mcq: 0, calc: 0 };
            const wrongLessons = new Set();
            let wrongCount = 0;

            SECTIONS.forEach(sec => {
                order[sec.key].forEach(q => {
                    const type = sec.key;
                    const ok = checkOne(type, q);
                    const answered = isAnswered(type, q);
                    results[q.id] = ok;
                    if (ok) sectionScore[type] += POINTS[type];
                    else { wrongLessons.add(q.lesson); wrongCount++; }

                    const card = document.getElementById('card-' + q.id);
                    card.classList.remove('border-slate-100');
                    card.classList.add(ok ? 'border-emerald-300' : 'border-rose-300');

                    // 標示選項
                    if (type === 'tf') {
                        card.querySelectorAll('.choice').forEach(b => {
                            b.disabled = true;
                            const val = b.dataset.val === 'true';
                            if (val === q.a) setChoice(b, 'right');
                            else if (answered && ans[q.id] === val) setChoice(b, 'wrong');
                            else setChoice(b, 'dim');
                        });
                    } else if (type === 'mcq') {
                        card.querySelectorAll('.choice').forEach(b => {
                            b.disabled = true;
                            const text = mcqOpts[q.id][Number(b.dataset.idx)];
                            if (text === q.a) setChoice(b, 'right');
                            else if (answered && ans[q.id] === text) setChoice(b, 'wrong');
                            else setChoice(b, 'dim');
                        });
                    } else {
                        card.querySelectorAll('.calc-input').forEach((inp, i) => {
                            inp.disabled = true;
                            const good = inp.value.trim() !== '' && Number(inp.value) === q.a[i];
                            inp.classList.remove('border-slate-200');
                            inp.classList.add(good ? 'border-emerald-500' : 'border-rose-500', good ? 'bg-emerald-50' : 'bg-rose-50');
                        });
                    }

                    // 解析
                    const correctText = type === 'tf' ? (q.a ? '⭕ 對' : '❌ 錯')
                                      : type === 'mcq' ? q.a
                                      : formatCalcAnswer(q);
                    const fb = document.getElementById('fb-' + q.id);
                    fb.classList.remove('hidden');
                    if (ok) {
                        fb.className = 'bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-2xl p-3 text-sm leading-relaxed';
                        fb.innerHTML = `<b>✅ 答對了！</b><br>💡 ${ft(q.exp)}`;
                    } else {
                        fb.className = 'bg-rose-50 text-rose-800 border border-rose-200 rounded-2xl p-3 text-sm leading-relaxed';
                        fb.innerHTML = `<b>${answered ? '❌ 答錯了' : '⚪ 沒有作答'}</b>　正確答案：<b>${ft(correctText)}</b><br>💡 ${ft(q.exp)}`;
                    }
                });
            });

            const total = sectionScore.tf + sectionScore.mcq + sectionScore.calc;
            renderResult(total, sectionScore, [...wrongLessons].sort(), wrongCount);

            document.getElementById('introCard').classList.add('hidden');
            document.getElementById('headerCount').classList.add('hidden');
            document.getElementById('barExam').classList.add('hidden');
            document.getElementById('barDone').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            speak(total === 100
                ? '太厲害了！你全部答對，一百分！'
                : `考試結束！你的得分是 ${total} 分。${wrongCount > 0 ? '看看答錯的題目，再試一次吧！' : ''}`);
        }

        function renderResult(total, sectionScore, wrongLessons, wrongCount) {
            let emoji, msg;
            if (total >= 90) { emoji = '🏆'; msg = '太厲害了！你是數學小達人！'; }
            else if (total >= 80) { emoji = '🌟'; msg = '很棒喔！再細心一點就更完美了！'; }
            else if (total >= 60) { emoji = '👍'; msg = '不錯喔！看看錯題的解析，再挑戰一次吧！'; }
            else { emoji = '💪'; msg = '沒關係！先複習一下課程，再來挑戰！'; }

            const review = wrongLessons.length
                ? `<div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-sm text-amber-900 font-medium space-y-2">
                       <div class="font-black">📚 建議複習：</div>
                       <div class="flex flex-wrap gap-2">${wrongLessons.map(n =>
                           `<a href="lesson${n}.html" class="bg-white border border-amber-200 text-amber-800 font-bold px-3 py-1.5 rounded-full text-xs active:scale-95 transition">第 ${n} 課 ${LESSON_NAMES[n]}</a>`).join('')}</div>
                   </div>`
                : `<div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 text-sm text-emerald-800 font-black text-center">🎉 全部答對，沒有需要複習的單元！</div>`;

            const filterBtn = wrongCount > 0
                ? `<button id="filterBtn" onclick="toggleOnlyWrong()" class="w-full bg-rose-50 text-rose-700 font-bold py-2.5 rounded-2xl border border-rose-200 active:scale-95 transition">👀 只看錯題（${wrongCount} 題）</button>`
                : '';

            const card = document.getElementById('resultCard');
            card.className = 'pop';
            card.innerHTML = `
                <div class="bg-white rounded-3xl border-2 border-amber-200 shadow-md p-5 space-y-4 text-center">
                    <div class="text-6xl">${emoji}</div>
                    <div>
                        <div class="text-sm font-bold text-slate-500">你的得分</div>
                        <div class="text-5xl font-black text-amber-600">${total}<span class="text-xl text-slate-400"> / 100</span></div>
                        <p class="mt-1 text-sm font-bold text-slate-600">${msg}</p>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-xs font-bold">
                        <div class="bg-sky-50 text-sky-800 rounded-2xl py-2">⭕ 是非題<div class="text-base font-black">${sectionScore.tf} / 20</div></div>
                        <div class="bg-violet-50 text-violet-800 rounded-2xl py-2">🔘 單選題<div class="text-base font-black">${sectionScore.mcq} / 40</div></div>
                        <div class="bg-amber-50 text-amber-800 rounded-2xl py-2">🧮 計算題<div class="text-base font-black">${sectionScore.calc} / 40</div></div>
                    </div>
                    <div class="text-left">${review}</div>
                    ${filterBtn}
                </div>`;
        }

        function toggleOnlyWrong() {
            onlyWrong = !onlyWrong;
            document.querySelectorAll('.qcard').forEach(card => {
                const id = card.id.replace('card-', '');
                card.classList.toggle('hidden', onlyWrong && results[id]);
            });
            const btn = document.getElementById('filterBtn');
            if (btn) {
                const wrong = Object.values(results).filter(v => !v).length;
                btn.innerText = onlyWrong ? '📋 看全部題目' : `👀 只看錯題（${wrong} 題）`;
            }
        }

        // ================= 開始／重新測驗 =================
        function startExam() {
            SECTIONS.forEach(sec => { order[sec.key] = shuffle(bank[sec.key]); });
            mcqOpts = {};
            bank.mcq.forEach(q => { mcqOpts[q.id] = shuffle(q.opts); });
            ans = {};
            results = {};
            graded = false;
            onlyWrong = false;
            render();
            updateCount();
        }

        function restartExam() {
            stopSpeech();
            startExam();
            const rc = document.getElementById('resultCard');
            rc.className = 'hidden';
            rc.innerHTML = '';
            document.getElementById('introCard').classList.remove('hidden');
            document.getElementById('headerCount').classList.remove('hidden');
            document.getElementById('barExam').classList.remove('hidden');
            document.getElementById('barDone').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.querySelectorAll('.totalQ').forEach(el => { el.innerText = TOTAL; });
        startExam();
    </script>
</body>
</html>
